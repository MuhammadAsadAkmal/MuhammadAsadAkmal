# ------------------------------------------------------------------
#  Self-generated GitHub metrics for the profile README.
#
#  Replaces the public github-readme-stats / trophy services, which are
#  often rate-limited. SVGs are rendered here and published to the
#  `metrics` branch (kept separate from the snake's `output` branch,
#  because each publish replaces the whole branch).
#
#  ONE-TIME SETUP:
#   1. Create a classic Personal Access Token (github.com/settings/tokens)
#      with scopes: read:user, repo  (repo lets private work count).
#   2. Repo Settings → Secrets and variables → Actions → New secret
#      named METRICS_TOKEN with that token.
#   3. Actions tab → "Generate Metrics" → "Run workflow".
# ------------------------------------------------------------------
name: Generate Metrics

on:
  schedule:
    # daily
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Overview (profile, activity, languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.overview.svg
          output_action: none
          base: header, activity, community, repositories
          config_timezone: Asia/Karachi
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss

      - name: Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          output_action: none
          base: ""
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.achievements.svg
          output_action: none
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_secrets: no

      - name: Collect renders
        run: |
          mkdir -p dist
          sudo cp /metrics_renders/*.svg dist/
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -la dist

      - name: Push to metrics branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: metrics
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
