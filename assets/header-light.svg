<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Muhammad Asad Akmal — Team Lead and Full-Stack Engineer">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E5CD8"/>
      <stop offset="0.5" stop-color="#7847BD"/>
      <stop offset="1" stop-color="#0B7FA8"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F2335"/>
      <stop offset="1" stop-color="#2E5CD8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#2E5CD8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2E5CD8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C9CFE2" opacity="0.55"/>
    </pattern>
    <clipPath id="c1"><rect x="600" y="118" height="24" width="0"><animate attributeName="width" values="0;0;330;330" keyTimes="0;0.04;0.14;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="600" y="146" height="24" width="0"><animate attributeName="width" values="0;0;330;330" keyTimes="0;0.16;0.17;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="600" y="182" height="24" width="0"><animate attributeName="width" values="0;0;330;330" keyTimes="0;0.22;0.32;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="600" y="210" height="24" width="0"><animate attributeName="width" values="0;0;330;330" keyTimes="0;0.34;0.35;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="600" y="246" height="24" width="0"><animate attributeName="width" values="0;0;330;330" keyTimes="0;0.40;0.52;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c6"><rect x="600" y="274" height="24" width="0"><animate attributeName="width" values="0;0;330;330" keyTimes="0;0.56;0.57;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- card -->
  <rect x="1.5" y="1.5" width="997" height="417" rx="18" fill="#FFFFFF" stroke="url(#border)" stroke-width="2"/>
  <rect x="3" y="3" width="994" height="414" rx="17" fill="url(#dots)"/>
  <rect x="3" y="3" width="994" height="414" rx="17" fill="url(#glow)"/>

  <!-- left: identity -->
  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <text x="48" y="78" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#2E5CD8" letter-spacing="1.5">// TEAM LEAD · FULL-STACK ENGINEER</text>
    <text x="46" y="132" font-size="44" font-weight="700" fill="url(#name)">Muhammad Asad</text>
    <text x="46" y="182" font-size="44" font-weight="700" fill="url(#name)">Akmal<tspan fill="#2E5CD8">.</tspan></text>
    <text x="48" y="220" font-size="16" fill="#3B4261">Building and scaling production SaaS,</text>
    <text x="48" y="243" font-size="16" fill="#3B4261">AI-powered applications and complex web systems.</text>

    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5">
      <rect x="48" y="264" width="62" height="26" rx="13" fill="#E8ECF6" stroke="#2E5CD8" stroke-opacity="0.5"/>
      <text x="79" y="281.5" text-anchor="middle" fill="#2E5CD8">SaaS</text>
      <rect x="118" y="264" width="46" height="26" rx="13" fill="#E8ECF6" stroke="#7847BD" stroke-opacity="0.5"/>
      <text x="141" y="281.5" text-anchor="middle" fill="#7847BD">AI</text>
      <rect x="172" y="264" width="170" height="26" rx="13" fill="#E8ECF6" stroke="#0B7FA8" stroke-opacity="0.5"/>
      <text x="257" y="281.5" text-anchor="middle" fill="#0B7FA8">System Architecture</text>
      <rect x="350" y="264" width="116" height="26" rx="13" fill="#E8ECF6" stroke="#3D7A1A" stroke-opacity="0.5"/>
      <text x="408" y="281.5" text-anchor="middle" fill="#3D7A1A">Leadership</text>
    </g>
  </g>

  <!-- right: terminal -->
  <g>
    <rect x="570" y="28" width="390" height="274" rx="12" fill="#16161E" stroke="#414868"/>
    <path d="M570 40a12 12 0 0 1 12-12h366a12 12 0 0 1 12 12v24H570z" fill="#1F2335"/>
    <circle cx="592" cy="46" r="5.5" fill="#F7768E"/>
    <circle cx="610" cy="46" r="5.5" fill="#E0AF68"/>
    <circle cx="628" cy="46" r="5.5" fill="#9ECE6A"/>
    <text x="765" y="50" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#565F89">asad@prod ~ zsh</text>

    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <text x="590" y="98" fill="#565F89"># asadakmal.com</text>

      <g clip-path="url(#c1)"><text x="600" y="136"><tspan fill="#9ECE6A">❯</tspan><tspan fill="#C0CAF5"> whoami</tspan></text></g>
      <g clip-path="url(#c2)"><text x="600" y="164" fill="#A9B1D6">team lead · full-stack · architect</text></g>

      <g clip-path="url(#c3)"><text x="600" y="200"><tspan fill="#9ECE6A">❯</tspan><tspan fill="#C0CAF5"> cat stack.txt</tspan></text></g>
      <g clip-path="url(#c4)"><text x="600" y="228" fill="#7DCFFF">next.js · nestjs · typescript · ai</text></g>

      <g clip-path="url(#c5)"><text x="600" y="264"><tspan fill="#9ECE6A">❯</tspan><tspan fill="#C0CAF5"> deploy --env=production</tspan></text></g>
      <g clip-path="url(#c6)"><text x="600" y="292" fill="#9ECE6A">✓ shipped · secure · scalable</text></g>
    </g>
  </g>
  <!-- stats -->
  <path d="M40 322H960" stroke="#C9CFE2" stroke-dasharray="3 5"/>
  <rect x="40" y="338" width="218" height="58" rx="10" fill="#F6F8FD" stroke="#2E5CD8" stroke-opacity="0.35"/>
  <text x="58" y="376" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#2E5CD8">5+</text>
  <text x="103" y="373" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#3B4261">years in production</text>
  <rect x="274" y="338" width="218" height="58" rx="10" fill="#F6F8FD" stroke="#7847BD" stroke-opacity="0.35"/>
  <text x="292" y="376" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#7847BD">10k+</text>
  <text x="362" y="373" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#3B4261">active users served</text>
  <rect x="508" y="338" width="218" height="58" rx="10" fill="#F6F8FD" stroke="#0B7FA8" stroke-opacity="0.35"/>
  <text x="526" y="376" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#0B7FA8">6</text>
  <text x="553" y="373" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#3B4261">engineers led</text>
  <rect x="742" y="338" width="218" height="58" rx="10" fill="#F6F8FD" stroke="#3D7A1A" stroke-opacity="0.35"/>
  <text x="760" y="376" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#3D7A1A">5</text>
  <text x="787" y="373" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#3B4261">production platforms</text>
</svg>
