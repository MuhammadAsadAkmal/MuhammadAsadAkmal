<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="612" viewBox="0 0 1000 612" role="img" aria-label="Architecture of the stack: frontend, backend and APIs, data, AI, security, integrations, cloud and DevOps, with technical leadership across every layer">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E8ECF6" stroke-width="1"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E5CD8"/>
      <stop offset="1" stop-color="#7847BD"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="997" height="609" rx="18" fill="#FFFFFF" stroke="url(#edge)" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="3" y="3" width="994" height="606" rx="17" fill="url(#grid)" opacity="1"/>

  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <!-- heading -->
    <text x="40" y="38" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#6A7294" letter-spacing="1.5">// ARCHITECTURE.md</text>
    <text x="40" y="66" font-size="22" font-weight="700" fill="#1F2335">How I build — the system behind the work</text>

    <!-- connectors -->
    <g stroke="#C9CFE2" stroke-width="2" fill="none">
      <path d="M410 160V190"/>
      <path d="M410 260V275M128 275H695M128 275V290M316 275V290M504 275V290M695 275V290"/>
      <path d="M128 410V430H695V410M410 430V450"/>
    </g>
    <g stroke="#B8591A" stroke-width="1.5" stroke-dasharray="4 5" stroke-opacity="0.7">
      <path d="M780 125H800"/><path d="M780 225H800"/><path d="M783 350H800"/><path d="M780 485H800"/>
    </g>

    <!-- data flowing through the system -->
    <circle cx="410" r="3.5" fill="#2E5CD8"><animate attributeName="cy" values="160;190" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#7847BD"><animateMotion path="M410 260V275H128V290" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#7847BD"><animateMotion path="M410 260V275H504V290" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#7847BD"><animateMotion path="M410 260V275H695V290" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#3D7A1A"><animateMotion path="M316 410V430H410V450" dur="1.8s" repeatCount="indefinite"/></circle>

    <!-- 01 frontend -->
    <rect x="40" y="90" width="740" height="70" rx="12" fill="#F6F8FD" stroke="#2E5CD8" stroke-opacity="0.55"/>
    <rect x="40" y="90" width="4" height="70" rx="2" fill="#2E5CD8"/>
    <text x="62" y="116" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#2E5CD8" letter-spacing="1.2">01 · FRONTEND</text>
    <text x="62" y="143" font-size="15.5" fill="#1F2335">Next.js · React · TanStack Query · Zustand · Tailwind CSS</text>

    <!-- 02 backend -->
    <rect x="40" y="190" width="740" height="70" rx="12" fill="#F6F8FD" stroke="#7847BD" stroke-opacity="0.55"/>
    <rect x="40" y="190" width="4" height="70" rx="2" fill="#7847BD"/>
    <text x="62" y="216" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#7847BD" letter-spacing="1.2">02 · BACKEND &amp; APIs</text>
    <text x="62" y="243" font-size="15.5" fill="#1F2335">NestJS · Node.js · Express · GraphQL · Apollo · REST · WebSockets</text>

    <!-- 03-06 services row -->
    <g font-size="14" fill="#1F2335">
      <rect x="40" y="290" width="176" height="120" rx="12" fill="#F6F8FD" stroke="#0B7FA8" stroke-opacity="0.55"/>
      <text x="58" y="318" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#0B7FA8" letter-spacing="1.2">03 · DATA</text>
      <text x="58" y="346">PostgreSQL</text>
      <text x="58" y="370">Redis</text>
      <text x="58" y="394">Multi-Tenancy</text>

      <rect x="228" y="290" width="176" height="120" rx="12" fill="#F6F8FD" stroke="#7847BD" stroke-opacity="0.8"/>
      <text x="246" y="318" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#7847BD" letter-spacing="1.2">04 · AI</text>
      <circle cx="388" cy="314" r="4" fill="#7847BD"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="246" y="346">RAG · Embeddings</text>
      <text x="246" y="370">LLM Apps · AI Agents</text>
      <text x="246" y="394">LangGraph · Workflows</text>

      <rect x="416" y="290" width="176" height="120" rx="12" fill="#F6F8FD" stroke="#C4344F" stroke-opacity="0.55"/>
      <text x="434" y="318" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#C4344F" letter-spacing="1.2">05 · SECURITY</text>
      <text x="434" y="346">JWT · OAuth</text>
      <text x="434" y="370">RBAC · 2FA</text>
      <text x="434" y="394">Secure API Design</text>

      <rect x="604" y="290" width="176" height="120" rx="12" fill="#F6F8FD" stroke="#8F5E15" stroke-opacity="0.55"/>
      <text x="622" y="318" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#8F5E15" letter-spacing="1.2">06 · INTEGRATIONS</text>
      <text x="622" y="346">Stripe · PayPal</text>
      <text x="622" y="370">CRM · Analytics</text>
      <text x="622" y="394">Identity Verification</text>
    </g>

    <!-- 07 cloud -->
    <rect x="40" y="450" width="740" height="70" rx="12" fill="#F6F8FD" stroke="#3D7A1A" stroke-opacity="0.55"/>
    <rect x="40" y="450" width="4" height="70" rx="2" fill="#3D7A1A"/>
    <text x="62" y="476" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#3D7A1A" letter-spacing="1.2">07 · CLOUD, DEVOPS &amp; MONOREPOS</text>
    <text x="62" y="503" font-size="15.5" fill="#1F2335">AWS · Docker · Nginx · GitHub Actions · CI/CD · Turborepo · Nx</text>

    <!-- leadership rail -->
    <rect x="800" y="90" width="160" height="430" rx="12" fill="#F6F8FD" stroke="#B8591A" stroke-opacity="0.55"/>
    <text x="818" y="116" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#B8591A" letter-spacing="1.2">∞ · LEADERSHIP</text>
    <g font-size="14" fill="#1F2335">
      <text x="818" y="146">Architecture</text>
      <text x="818" y="172">Code Review</text>
      <text x="818" y="198">Mentoring</text>
      <text x="818" y="224">Eng. Standards</text>
      <text x="818" y="250">Delivery</text>
    </g>
    <path d="M818 276H942" stroke="#C9CFE2"/>
    <text x="818" y="304" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#6A7294" letter-spacing="1.2">TOOLING</text>
    <g font-size="14" fill="#3B4261">
      <text x="818" y="334">Git · pnpm</text>
      <text x="818" y="360">Vitest · Jest</text>
      <text x="818" y="386">Postman</text>
      <text x="818" y="412">ESLint</text>
    </g>
    <text x="818" y="500" font-size="12" fill="#6A7294" font-style="italic">across every layer</text>

    <!-- languages strip -->
    <rect x="40" y="544" width="920" height="44" rx="10" fill="#F3F5FA" stroke="#C9CFE2"/>
    <text x="62" y="571" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#6A7294" letter-spacing="1.2">LANGUAGES</text>
    <text x="160" y="571" font-size="15" fill="#1F2335"><tspan fill="#2E5CD8">TypeScript</tspan>  ·  JavaScript  ·  Python  ·  Solidity</text>
  </g>
</svg>
